[project]
name = "starter"
version = "0.6.1"  # harus sama dengan APP_VERSION di app/meta.py (build.py memeriksanya)
description = "Starter GUI PySide6"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "qtawesome>=1.3",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]

[tool.uv]
package = false
